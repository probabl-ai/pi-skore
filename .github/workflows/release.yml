name: Release

# Publish to npm via Trusted Publishing (OIDC) — no NPM_TOKEN secret.
#
# Normal flow: update the pinned inner versions if needed, bump "version" in
# package.json, commit, then create a GitHub Release whose tag matches the
# version (e.g. tag "0.1.1"). This workflow installs the pinned bundle, runs
# `npm run verify`, then `npm publish --provenance`.
#
# Manual flow: Actions -> Release -> Run workflow. It defaults to a dry run;
# clear the checkbox to actually publish the current package.json version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only run `npm publish --dry-run` (no upload)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Never run two publishes for the same ref concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1

      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi
          echo "Releasing $VERSION (tag $TAG)"

      # --legacy-peer-deps matches the `prepack` script; the extensions declare
      # Pi host packages as peers that are not installed here.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify the bundle
        run: npm run verify

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run --access public

      - name: Publish
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
